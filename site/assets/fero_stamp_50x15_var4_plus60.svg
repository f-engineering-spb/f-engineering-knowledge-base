<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .stamp-letters {
        font-family: 'Montserrat', Arial Black, sans-serif;
        font-weight: 800;
        font-size: 104px;
        letter-spacing: 5px;
        fill: #fafbfc;
        stroke: #0f172a;
        stroke-width: 2.0;
        stroke-opacity: 0.82;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .cell-border {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 1.2;
        stroke-dasharray: 4 2;
      }
    </style>

    <filter id="relief-var4_plus60" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <!-- Contact Shadow -->
      <feDropShadow in="SourceAlpha" dx="-2.1" dy="3.0" stdDeviation="1.4" flood-color="#0f172a" flood-opacity="0.82" result="contactShadow"/>
      <!-- Cast Shadow -->
      <feDropShadow in="SourceAlpha" dx="-8.5" dy="11.5" stdDeviation="3.2" flood-color="#1e293b" flood-opacity="0.54" result="castShadow"/>
      <feMerge result="allShadows">
        <feMergeNode in="castShadow"/>
        <feMergeNode in="contactShadow"/>
      </feMerge>

      <!-- Bevel / Chamfer Slope -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="chamferSlope"/>
      <feDiffuseLighting in="chamferSlope" surfaceScale="4.0" diffuseConstant="1.20" lighting-color="#ffffff" result="diffuseLight">
        <feDistantLight azimuth="315" elevation="55"/>
      </feDiffuseLighting>
      <feSpecularLighting in="chamferSlope" surfaceScale="3.0" specularConstant="0.85" specularExponent="22" lighting-color="#ffffff" result="specLight">
        <feDistantLight azimuth="315" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="diffuseLight" in2="SourceAlpha" operator="in" result="diffuseMasked"/>
      <feComposite in="specLight" in2="SourceAlpha" operator="in" result="specMasked"/>
      <feBlend in="specMasked" in2="diffuseMasked" mode="screen" result="shadedBevelRaw"/>

      <feComponentTransfer in="shadedBevelRaw" result="shadedBevel">
        <feFuncR type="linear" slope="0.80" intercept="0.20"/>
        <feFuncG type="linear" slope="0.82" intercept="0.18"/>
        <feFuncB type="linear" slope="0.84" intercept="0.16"/>
      </feComponentTransfer>

      <!-- Plateau Face -->
      <feMorphology in="SourceAlpha" operator="erode" radius="1.8" result="plateauAlpha"/>
      <feFlood flood-color="#fbfcff" result="plateauFill"/>
      <feComposite in="plateauFill" in2="plateauAlpha" operator="in" result="flatPlateau"/>

      <feGaussianBlur in="plateauAlpha" stdDeviation="0.4" result="plateauBlur"/>
      <feSpecularLighting in="plateauBlur" surfaceScale="1.2" specularConstant="0.4" specularExponent="14" lighting-color="#ffffff" result="plateauGlint"/>
      <feComposite in="plateauGlint" in2="plateauAlpha" operator="in" result="plateauGlintMasked"/>
      <feBlend in="plateauGlintMasked" in2="flatPlateau" mode="screen" result="finishedPlateau"/>

      <feComposite in="finishedPlateau" in2="shadedBevel" operator="over" result="finishedFace"/>
      <feMerge>
        <feMergeNode in="allShadows"/>
        <feMergeNode in="finishedFace"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cell boundary 50x15 mm representation -->
  <rect x="1" y="1" width="498" height="148" class="cell-border"/>

  <!-- Centered 3D Word FERO scaled strictly to 10 x 42 mm -->
  <g transform="translate(250, 120) scale(1.227, 1.255)">
    <text x="0" y="0" class="stamp-letters" text-anchor="middle" filter="url(#relief-var4_plus60)">ФЕРО</text>
  </g>
</svg>