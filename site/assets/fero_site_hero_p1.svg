<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;display=swap');
      .hero-bg { fill: #f8fafc; }
      .hero-title { font-family: 'Montserrat', Arial Black, sans-serif; font-weight: 800; font-size: 140px; letter-spacing: 8px; fill: #fafbfc; }
      .hero-desc { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 9px; fill: #0f172a; text-transform: uppercase; }
      .hero-nav { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 4px; fill: #0369a1; text-transform: uppercase; }
      .hero-slash { fill: #94a3b8; font-weight: 300; }
      .hero-manif { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 2px; fill: #475569; text-transform: uppercase; }
      .sun-line { stroke: #334155; stroke-width: 1.2; fill: none; }
      .sun-thin { stroke: #64748b; stroke-width: 0.9; fill: none; }
      .sun-dashed { stroke: #475569; stroke-width: 1.0; stroke-dasharray: 3 3; fill: none; }
      .sun-text { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .sun-node { fill: #ffffff; stroke: #0f172a; stroke-width: 1.2; }
    </style>
    <filter id="relief-3d" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow in="SourceAlpha" dx="-1.5" dy="2" stdDeviation="1.0" flood-color="#0f172a" flood-opacity="0.55" result="contactShadow"/>
      <feDropShadow in="SourceAlpha" dx="-10" dy="14" stdDeviation="2.5" flood-color="#1e293b" flood-opacity="0.32" result="castShadow"/>
      <feMerge result="allShadows"><feMergeNode in="castShadow"/><feMergeNode in="contactShadow"/></feMerge>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="chamferSlope"/>
      <feDiffuseLighting in="chamferSlope" surfaceScale="5.0" diffuseConstant="1.15" lighting-color="#ffffff" result="diffuseLight"><feDistantLight azimuth="315" elevation="55"/></feDiffuseLighting>
      <feSpecularLighting in="chamferSlope" surfaceScale="4.0" specularConstant="0.80" specularExponent="20" lighting-color="#ffffff" result="specLight"><feDistantLight azimuth="315" elevation="55"/></feSpecularLighting>
      <feComposite in="diffuseLight" in2="SourceAlpha" operator="in" result="diffuseMasked"/>
      <feComposite in="specLight" in2="SourceAlpha" operator="in" result="specMasked"/>
      <feBlend in="specMasked" in2="diffuseMasked" mode="screen" result="shadedBevelRaw"/>
      <feComponentTransfer in="shadedBevelRaw" result="shadedBevel">
        <feFuncR type="linear" slope="0.78" intercept="0.22"/><feFuncG type="linear" slope="0.80" intercept="0.20"/><feFuncB type="linear" slope="0.82" intercept="0.18"/>
      </feComponentTransfer>
      <feMorphology in="SourceAlpha" operator="erode" radius="2.8" result="plateauAlpha"/>
      <feFlood flood-color="#fbfcff" result="plateauFill"/><feComposite in="plateauFill" in2="plateauAlpha" operator="in" result="flatPlateau"/>
      <feGaussianBlur in="plateauAlpha" stdDeviation="0.4" result="plateauBlur"/>
      <feSpecularLighting in="plateauBlur" surfaceScale="1.5" specularConstant="0.4" specularExponent="12" lighting-color="#ffffff" result="plateauGlint"/>
      <feComposite in="plateauGlint" in2="plateauAlpha" operator="in" result="plateauGlintMasked"/>
      <feBlend in="plateauGlintMasked" in2="flatPlateau" mode="screen" result="finishedPlateau"/>
      <feComposite in="finishedPlateau" in2="shadedBevel" operator="over" result="finishedFace"/>
      <feMerge><feMergeNode in="allShadows"/><feMergeNode in="finishedFace"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="650" class="hero-bg"/>
  <g transform="translate(750, 45) scale(0.85)">
    <line x1="20" y1="55" x2="235" y2="55" class="sun-line"/>
    <circle cx="235" cy="55" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
    <line x1="235" y1="33" x2="235" y2="25" class="sun-line"/>
    <line x1="235" y1="77" x2="235" y2="85" class="sun-line"/>
    <line x1="213" y1="55" x2="205" y2="55" class="sun-line"/>
    <line x1="257" y1="55" x2="265" y2="55" class="sun-line"/>
    <line x1="220" y1="40" x2="214" y2="34" class="sun-line"/>
    <line x1="250" y1="70" x2="256" y2="76" class="sun-line"/>
    <line x1="220" y1="70" x2="214" y2="76" class="sun-line"/>
    <line x1="250" y1="40" x2="256" y2="34" class="sun-line"/>
    <line x1="235" y1="55" x2="235" y2="175" class="sun-thin"/>
    <line x1="235" y1="55" x2="165" y2="170" class="sun-thin"/>
    <line x1="235" y1="55" x2="105" y2="155" class="sun-thin"/>
    <line x1="235" y1="55" x2="35" y2="135" class="sun-line" stroke-width="1.3"/>
    <line x1="235" y1="55" x2="270" y2="40" class="sun-dashed"/>
    <circle cx="95" cy="111" r="2.8" class="sun-node"/>
    <path d="M 140 55 A 95 95 0 0 1 200 142" class="sun-line"/>
    <path d="M 110 55 A 125 125 0 0 1 185 170" class="sun-thin"/>
    <text x="70" y="98" class="sun-text" font-weight="700" letter-spacing="0.5px">SUN 60°</text>
    <text x="148" y="112" class="sun-text">50°</text>
    <text x="178" y="132" class="sun-text">40°</text>
    <text x="198" y="156" class="sun-text">30°</text>
    <circle cx="165" cy="170" r="2" class="sun-node"/>
    <circle cx="185" cy="170" r="2" class="sun-node"/>
    <circle cx="235" cy="175" r="2" class="sun-node"/>
  </g>
  <g filter="url(#relief-3d)">
    <text x="600" y="270" class="hero-title" text-anchor="middle">ФЕРО</text>
  </g>
  <text x="605" y="325" class="hero-desc" text-anchor="middle">ФАСАДНЫЙ ИНЖИНИРИНГ</text>
  
  <text x="600" y="420" class="hero-nav" text-anchor="middle">
    ПРОЕКТИРОВАНИЕ <tspan class="hero-slash">/</tspan> ПРОИЗВОДСТВО <tspan class="hero-slash">/</tspan> МОНТАЖ <tspan class="hero-slash">/</tspan> ЭКСПЕРТИЗА
  </text>
  
  <text x="600" y="480" class="hero-manif" text-anchor="middle">
    ИНЖИНИРИНГ ФАСАДНЫХ ОБОЛОЧЕК НА СТЫКЕ АРХИТЕКТУРЫ, ФИЗИКИ МАТЕРИАЛОВ
  </text>
  <text x="600" y="505" class="hero-manif" text-anchor="middle">
    И ТОЧНОГО МАТЕМАТИЧЕСКОГО РАСЧЁТА
  </text>
</svg>